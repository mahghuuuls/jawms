/**
 * It is advised that you do not edit anything in the build.gradle; unless you are sure of what you are doing
 */
import com.gtnewhorizons.retrofuturagradle.mcp.InjectTagsTask
import net.darkhax.curseforgegradle.TaskPublishCurseForge
import org.jetbrains.changelog.Changelog
import org.jetbrains.gradle.ext.Gradle

plugins {
    id 'java'
    id 'java-library'
    id 'maven-publish'
    id 'org.jetbrains.gradle.plugin.idea-ext' version '1.4.1'
    id 'com.gtnewhorizons.retrofuturagradle' version '2.0.2'
    id 'net.darkhax.curseforgegradle' version '1.2.+' apply false
    id 'com.modrinth.minotaur' version '2.+' apply false
    id 'org.jetbrains.changelog' version '2.5.0'
    id 'com.gradleup.shadow' version '9.4.+'
}

apply from: 'gradle/scripts/helpers.gradle'

// Early Assertions
assertProperty 'mod_version'
assertProperty 'root_package'
assertProperty 'mod_id'
assertProperty 'mod_name'

assertSubProperties 'use_tags', 'tag_class_name'
assertSubProperties 'use_access_transformer', 'access_transformer_locations'
assertSubProperties 'use_mixins', 'mixin_booter_version', 'mixin_refmap'
assertSubProperties 'is_coremod', 'coremod_includes_mod', 'coremod_plugin_class_name'
assertSubProperties 'use_asset_mover', 'asset_mover_version'

setDefaultProperty 'use_modern_java_syntax', false, false
setDefaultProperty 'use_jetbrains_annotations', false, false
setDefaultProperty 'generate_sources_jar', true, false
setDefaultProperty 'generate_javadocs_jar', true, false
setDefaultProperty 'mapping_channel', true, 'stable'
setDefaultProperty 'mapping_version', true, '39'
setDefaultProperty 'use_dependency_at_files', true, true
setDefaultProperty 'minecraft_username', true, 'Developer'
setDefaultProperty 'extra_jvm_args', false, ''
setDefaultProperty 'extra_tweak_classes', false, ''
setDefaultProperty 'change_minecraft_sources', false, false
setDefaultProperty 'publish_to_curseforge', true, false

version = propertyString('mod_version')
group = propertyString('root_package')

base {
    archivesName.set(propertyString('mod_id'))
}

tasks.decompressDecompiledSources.enabled !propertyBool('change_minecraft_sources') || !layout.buildDirectory.dir('rfg/minecraft-src').get().asFile.exists()

java {
    toolchain {
        languageVersion.set(JavaLanguageVersion.of(propertyBool('use_modern_java_syntax') ? 16 : 8))
        // Match the Eclipse Temurin JDKs used by the approved development environment.
        vendor.set(JvmVendorSpec.ADOPTIUM)
    }
    if (propertyBool('generate_sources_jar')) {
        withSourcesJar()
    }
    if (propertyBool('generate_javadocs_jar')) {
        withJavadocJar()
    }
}

minecraft {
    mcVersion.set('1.12.2')

    mcpMappingChannel.set(propertyString('mapping_channel'))
    mcpMappingVersion.set(propertyString('mapping_version'))

    useDependencyAccessTransformers.set(propertyBool('use_dependency_at_files'))

    username.set(propertyString('minecraft_username'))

    // Add any additional tweaker classes here
    extraTweakClasses.addAll(propertyStringList('extra_tweak_classes'))

    // Add various JVM arguments here for runtime
    def args = ['-ea:' + group]
    if (propertyBool('use_mixins')) {
        args << '-Dmixin.hotSwap=true'
        args << '-Dmixin.checks.interfaces=true'
        args << '-Dmixin.debug.export=true'
    }
    extraRunJvmArguments.addAll(args)
    extraRunJvmArguments.addAll(propertyStringList('extra_jvm_args'))

    if (propertyBool('use_tags')) {
        if (file('tags.properties').exists()) {
            Properties props = new Properties().tap { it.load(file('tags.properties').newInputStream()); it }
            if (!props.isEmpty()) {
                injectedTags.set(props.collectEntries { k, v ->
                        def interpolated = interpolate(v)
                        if (interpolated == null || interpolated.isEmpty()) throw new GradleException("Empty tag value found for key: $k")
                        [(k): interpolated]
                    })
            }
        }
    }
}

repositories {
    maven {
        name 'CleanroomMC Maven'
        url 'https://maven.cleanroommc.com'
    }
    maven {
        name 'SpongePowered Maven'
        url 'https://repo.spongepowered.org/repository/maven-public/'
    }
}

dependencies {
    if (propertyBool('use_modern_java_syntax')) {
        annotationProcessor 'com.github.bsideup.jabel:jabel-javac-plugin:1.0.0'
        // Workaround for https://github.com/bsideup/jabel/issues/174
        annotationProcessor 'net.java.dev.jna:jna-platform:5.13.0'
        compileOnly ('com.github.bsideup.jabel:jabel-javac-plugin:1.0.0') {
            transitive = false
        }
        // Allow jdk.unsupported classes like sun.misc.Unsafe, workaround for JDK-8206937 and fixes crashes in tests
        patchedMinecraft 'me.eigenraven.java8unsupported:java-8-unsupported-shim:1.0.0'
        // Include for tests
        testAnnotationProcessor 'com.github.bsideup.jabel:jabel-javac-plugin:1.0.0'
        testCompileOnly('com.github.bsideup.jabel:jabel-javac-plugin:1.0.0') {
            transitive = false // We only care about the 1 annotation class
        }
    }
    if (propertyBool('use_jetbrains_annotations')) {
        compileOnly 'org.jetbrains:annotations:26.1.0'
    }
    if (propertyBool('use_asset_mover')) {
        implementation "com.cleanroommc:assetmover:${propertyString('asset_mover_version')}"
    }
    if (propertyBool('use_mixins')) {
        String mixin = modUtils.enableMixins("zone.rong:mixinbooter:${propertyString('mixin_booter_version')}", propertyString('mixin_refmap'))
        api (mixin) {
            transitive = false
        }
        annotationProcessor 'org.ow2.asm:asm-debug-all:5.2'
        annotationProcessor 'com.google.guava:guava:32.1.2-jre'
        annotationProcessor 'com.google.code.gson:gson:2.8.9'
        annotationProcessor (mixin) {
            transitive = false
        }
        // MixinBooter 11.8 follows Mixin 0.8.7; keep the compile-time
        // obfuscation processor aligned with the packaged runtime.
        annotationProcessor 'org.spongepowered:mixin:0.8.7:processor'
    }
    if (propertyBool('enable_junit_testing')) {
        testImplementation 'org.junit.jupiter:junit-jupiter:5.7.1'
        testImplementation 'org.mockito:mockito-core:3.12.4'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }
}

apply from: 'gradle/scripts/dependencies.gradle'

sourceSets {
    developmentFixture {
        java.srcDir 'src/developmentFixture/java'
        runtimeClasspath += output + sourceSets.main.runtimeClasspath
    }
    apiCompatibilityFixture {
        java.srcDir 'src/apiCompatibilityFixture/java'
        runtimeClasspath += output + sourceSets.main.runtimeClasspath
    }
    api12BinaryFixture {
        java.srcDir 'src/api12BinaryFixture/java'
    }
    api13BinaryFixture {
        java.srcDir 'src/api13BinaryFixture/java'
    }
}

configurations {
    api12PublishedArtifact {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
    api13PublishedArtifact {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
    developmentFixtureImplementation.extendsFrom implementation
    developmentFixtureCompileOnly.extendsFrom compileOnly
    apiCompatibilityFixtureImplementation.extendsFrom implementation
    apiCompatibilityFixtureCompileOnly.extendsFrom compileOnly
}

dependencies {
    api12PublishedArtifact 'curse.maven:just-another-wizardry-mana-system-1643697:8597828'
    api12BinaryFixtureCompileOnly rfg.deobf(
            'curse.maven:just-another-wizardry-mana-system-1643697:8597828')
    api13PublishedArtifact 'curse.maven:just-another-wizardry-mana-system-1643697:8632899'
    api13BinaryFixtureCompileOnly rfg.deobf(
            'curse.maven:just-another-wizardry-mana-system-1643697:8632899')
}

tasks.named(sourceSets.developmentFixture.compileJavaTaskName, JavaCompile).configure {
    dependsOn tasks.named(sourceSets.main.classesTaskName)
    classpath = tasks.named('compileJava', JavaCompile).get().classpath + sourceSets.main.output
}

tasks.named('compileTestJava', JavaCompile).configure {
    dependsOn sourceSets.developmentFixture.classesTaskName,
            sourceSets.apiCompatibilityFixture.classesTaskName
    classpath += sourceSets.developmentFixture.output
    classpath += sourceSets.apiCompatibilityFixture.output
}

tasks.named('test', Test).configure {
    classpath += sourceSets.developmentFixture.output
    classpath += sourceSets.apiCompatibilityFixture.output
}

tasks.named(sourceSets.apiCompatibilityFixture.compileJavaTaskName, JavaCompile).configure {
    dependsOn tasks.named(sourceSets.main.classesTaskName)
    classpath = tasks.named('compileJava', JavaCompile).get().classpath + sourceSets.main.output
    sourceCompatibility = targetCompatibility = 8
}

def compileApi12BinaryFixture = tasks.named(
        sourceSets.api12BinaryFixture.compileJavaTaskName,
        JavaCompile
)
compileApi12BinaryFixture.configure {
    dependsOn tasks.named(sourceSets.main.compileJavaTaskName)
    classpath = tasks.named('compileJava', JavaCompile).get().classpath +
            configurations.api12BinaryFixtureCompileClasspath
    sourceCompatibility = targetCompatibility = 8
    doFirst {
        def candidateOutputs = sourceSets.main.output.files.collect { it.canonicalFile }
        def leakedCandidateOutputs = classpath.files.collect { it.canonicalFile }.findAll {
            candidateOutputs.contains(it)
        }
        if (!leakedCandidateOutputs.empty) {
            throw new GradleException(
                    "API 1.2 binary fixture classpath includes candidate output: ${leakedCandidateOutputs}")
        }
    }
}

def compileApi13BinaryFixture = tasks.named(
        sourceSets.api13BinaryFixture.compileJavaTaskName,
        JavaCompile
)
compileApi13BinaryFixture.configure {
    dependsOn tasks.named(sourceSets.main.compileJavaTaskName)
    classpath = tasks.named('compileJava', JavaCompile).get().classpath +
            configurations.api13BinaryFixtureCompileClasspath
    sourceCompatibility = targetCompatibility = 8
    doFirst {
        def candidateOutputs = sourceSets.main.output.files.collect { it.canonicalFile }
        def leakedCandidateOutputs = classpath.files.collect { it.canonicalFile }.findAll {
            candidateOutputs.contains(it)
        }
        if (!leakedCandidateOutputs.empty) {
            throw new GradleException(
                    "API 1.3 binary fixture classpath includes candidate output: ${leakedCandidateOutputs}")
        }
    }
}

def api12BinaryFixtureJar = tasks.register('api12BinaryFixtureJar', Jar) {
    group = 'verification'
    description = 'Packages the deobfuscated API 1.2 old-binary fixture.'
    dependsOn sourceSets.api12BinaryFixture.classesTaskName
    from sourceSets.api12BinaryFixture.output
    archiveBaseName.set('jawms-api-binary-fixture')
    archiveVersion.set('1.2')
    archiveClassifier.set('dev')
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

def reobfApi12BinaryFixtureJar = tasks.named('reobfApi12BinaryFixtureJar')

def api13BinaryFixtureJar = tasks.register('api13BinaryFixtureJar', Jar) {
    group = 'verification'
    description = 'Packages the deobfuscated API 1.3 old-binary fixture.'
    dependsOn sourceSets.api13BinaryFixture.classesTaskName
    from sourceSets.api13BinaryFixture.output
    archiveBaseName.set('jawms-api-binary-fixture')
    archiveVersion.set('1.3')
    archiveClassifier.set('dev')
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

def reobfApi13BinaryFixtureJar = tasks.named('reobfApi13BinaryFixtureJar')

def apiCompatibilityFixtureJar = tasks.register('apiCompatibilityFixtureJar', Jar) {
    group = 'verification'
    description = 'Packages the deobfuscated external API compatibility fixture.'
    dependsOn sourceSets.apiCompatibilityFixture.classesTaskName
    from sourceSets.apiCompatibilityFixture.output
    archiveBaseName.set('jawms-api-fixture')
    archiveVersion.set('1.0')
    archiveClassifier.set('dev')
}

// RetroFuturaGradle creates reobf<JarTaskName> tasks on demand. The fixture is
// an external mod, so it must cross the same MCP-to-SRG boundary as production.
def reobfApiCompatibilityFixtureJar = tasks.named('reobfApiCompatibilityFixtureJar')

tasks.register('verifyApiCompatibilityFixture') {
    group = 'verification'
    dependsOn reobfApiCompatibilityFixtureJar,
            reobfApi12BinaryFixtureJar,
            reobfApi13BinaryFixtureJar,
            tasks.named('reobfJar')
    doLast {
        def publishedApi12Files = configurations.api12PublishedArtifact.incoming.artifactView {
            attributes {
                attribute(
                        Attribute.of('rfgDeobfuscatorTransformed', Boolean),
                        false
                )
            }
        }.files.files
        if (publishedApi12Files.size() != 1) {
            throw new GradleException(
                    "Expected one published API 1.2 artifact, found ${publishedApi12Files}")
        }
        def publishedApi12 = publishedApi12Files.first()
        def publishedDigest = java.security.MessageDigest.getInstance('SHA-256')
                .digest(publishedApi12.bytes).encodeHex().toString().toUpperCase(Locale.ROOT)
        if (publishedApi12.length() != 307772L
                || publishedDigest != '41D03253AC43B241CEFD2011463975319F68F3BEA0B3D87AFD1E14B4A0DCA009') {
            throw new GradleException(
                    "Published API 1.2 artifact identity mismatch: ${publishedApi12}, "
                            + "size=${publishedApi12.length()}, sha256=${publishedDigest}")
        }

        def publishedApi13Files = configurations.api13PublishedArtifact.incoming.artifactView {
            attributes {
                attribute(
                        Attribute.of('rfgDeobfuscatorTransformed', Boolean),
                        false
                )
            }
        }.files.files
        if (publishedApi13Files.size() != 1) {
            throw new GradleException(
                    "Expected one published API 1.3 artifact, found ${publishedApi13Files}")
        }
        def publishedApi13 = publishedApi13Files.first()
        def publishedApi13Digest = java.security.MessageDigest.getInstance('SHA-256')
                .digest(publishedApi13.bytes).encodeHex().toString().toUpperCase(Locale.ROOT)
        if (publishedApi13.length() != 309941L
                || publishedApi13Digest != 'FBD7B938778F9BD9E8F96BC2E7C189266E10BFBDF7A2CA0FC0E86D2824192603') {
            throw new GradleException(
                    "Published API 1.3 artifact identity mismatch: ${publishedApi13}, "
                            + "size=${publishedApi13.length()}, sha256=${publishedApi13Digest}")
        }

        def readPublicApiClass = { byte[] bytes ->
            def input = new DataInputStream(new ByteArrayInputStream(bytes))
            if ((input.readInt() & 0xffffffffL) != 0xCAFEBABEL) {
                throw new GradleException('Invalid class-file magic in API descriptor audit')
            }
            input.readUnsignedShort()
            input.readUnsignedShort()
            int constantPoolCount = input.readUnsignedShort()
            def utf8 = new String[constantPoolCount]
            def classNameIndexes = new int[constantPoolCount]
            int index = 1
            while (index < constantPoolCount) {
                int tag = input.readUnsignedByte()
                switch (tag) {
                    case 1:
                        utf8[index] = input.readUTF()
                        break
                    case 3:
                    case 4:
                        input.skipBytes(4)
                        break
                    case 5:
                    case 6:
                        input.skipBytes(8)
                        index++
                        break
                    case 7:
                        classNameIndexes[index] = input.readUnsignedShort()
                        break
                    case 8:
                    case 16:
                    case 19:
                    case 20:
                        input.skipBytes(2)
                        break
                    case 9:
                    case 10:
                    case 11:
                    case 12:
                    case 17:
                    case 18:
                        input.skipBytes(4)
                        break
                    case 15:
                        input.skipBytes(3)
                        break
                    default:
                        throw new GradleException("Unsupported constant-pool tag ${tag}")
                }
                index++
            }

            int classAccess = input.readUnsignedShort()
            int thisClass = input.readUnsignedShort()
            int superClass = input.readUnsignedShort()
            String className = utf8[classNameIndexes[thisClass]]
            String superName = superClass == 0 ? null : utf8[classNameIndexes[superClass]]
            int interfaceCount = input.readUnsignedShort()
            def interfaces = [] as Set
            interfaceCount.times {
                interfaces.add(utf8[classNameIndexes[input.readUnsignedShort()]])
            }

            def members = [:]
            def readMembers = { String kind ->
                int count = input.readUnsignedShort()
                count.times {
                    int access = input.readUnsignedShort()
                    String name = utf8[input.readUnsignedShort()]
                    String descriptor = utf8[input.readUnsignedShort()]
                    int attributeCount = input.readUnsignedShort()
                    attributeCount.times {
                        input.readUnsignedShort()
                        int length = input.readInt()
                        int remaining = length
                        while (remaining > 0) {
                            int skipped = input.skipBytes(remaining)
                            if (skipped <= 0) {
                                input.readByte()
                                skipped = 1
                            }
                            remaining -= skipped
                        }
                    }
                    if ((access & (0x0001 | 0x0004)) != 0) {
                        members.put("${kind} ${name} ${descriptor}".toString(), access)
                    }
                }
            }
            readMembers('F')
            readMembers('M')
            [
                    name: className,
                    publicClass: (classAccess & 0x0001) != 0,
                    kind: classAccess & (0x0200 | 0x2000 | 0x4000),
                    access: classAccess,
                    superName: superName,
                    interfaces: interfaces,
                    members: members
            ]
        }

        def candidateApi = tasks.named('reobfJar').get().archiveFile.get().asFile
        def comparePublishedApi = { File publishedApi, String apiVersion ->
            def publishedArchive = new java.util.zip.ZipFile(publishedApi)
            def candidateArchive = new java.util.zip.ZipFile(candidateApi)
            try {
            def oldApiEntries = publishedArchive.entries().findAll {
                !it.directory
                        && it.name.startsWith('com/mahghuuuls/jawms/api/')
                        && it.name.endsWith('.class')
            }
            oldApiEntries.each { oldEntry ->
                def oldClass = readPublicApiClass(
                        publishedArchive.getInputStream(oldEntry).bytes)
                if (!oldClass.publicClass) {
                    return
                }
                def candidateEntry = candidateArchive.getEntry(oldEntry.name)
                if (candidateEntry == null) {
                    throw new GradleException(
                            "Candidate removed public API ${apiVersion} class ${oldClass.name}")
                }
                def candidateClass = readPublicApiClass(
                        candidateArchive.getInputStream(candidateEntry).bytes)
                if (!candidateClass.publicClass || candidateClass.kind != oldClass.kind) {
                    throw new GradleException(
                            "Candidate changed public API ${apiVersion} class kind/visibility for ${oldClass.name}")
                }
                if (candidateClass.superName != oldClass.superName
                        || candidateClass.interfaces != oldClass.interfaces) {
                    throw new GradleException(
                            "Candidate changed API ${apiVersion} hierarchy for ${oldClass.name}: "
                                    + "published=${oldClass.superName}/${oldClass.interfaces}, "
                                    + "candidate=${candidateClass.superName}/${candidateClass.interfaces}")
                }
                if ((oldClass.access & 0x0010) == 0 && (candidateClass.access & 0x0010) != 0) {
                    throw new GradleException(
                            "Candidate made API ${apiVersion} class final: ${oldClass.name}")
                }
                if ((oldClass.access & 0x0400) == 0 && (candidateClass.access & 0x0400) != 0) {
                    throw new GradleException(
                            "Candidate made API ${apiVersion} class abstract: ${oldClass.name}")
                }

                def missingDescriptors = []
                oldClass.members.each { descriptor, oldAccess ->
                    Integer candidateAccess = candidateClass.members[descriptor]
                    if (candidateAccess == null) {
                        missingDescriptors.add(descriptor)
                        return
                    }
                    boolean visibilityReduced = (oldAccess & 0x0001) != 0
                            && (candidateAccess & 0x0001) == 0
                    boolean staticChanged = (oldAccess & 0x0008) != (candidateAccess & 0x0008)
                    boolean newlyFinal = (oldAccess & 0x0010) == 0
                            && (candidateAccess & 0x0010) != 0
                    boolean newlyAbstract = (oldAccess & 0x0400) == 0
                            && (candidateAccess & 0x0400) != 0
                    if (visibilityReduced || staticChanged || newlyFinal || newlyAbstract) {
                        missingDescriptors.add(
                                "${descriptor} (published access=${oldAccess}, candidate access=${candidateAccess})")
                    }
                }
                if (!missingDescriptors.empty) {
                    throw new GradleException(
                            "Candidate removed or incompatibly changed API ${apiVersion} descriptors from "
                                    + "${oldClass.name}: ${missingDescriptors}")
                }

                def addedAbstractInstanceMethods = candidateClass.members.findAll {
                    descriptor, candidateAccess ->
                        descriptor.startsWith('M ')
                                && !oldClass.members.containsKey(descriptor)
                                && (candidateAccess & 0x0400) != 0
                                && (candidateAccess & 0x0008) == 0
                }.keySet()
                if (!addedAbstractInstanceMethods.empty) {
                    throw new GradleException(
                            "Candidate added required abstract methods to API ${apiVersion} type "
                                    + "${oldClass.name}: ${addedAbstractInstanceMethods}")
                }
            }
            } finally {
                publishedArchive.close()
                candidateArchive.close()
            }
        }
        comparePublishedApi(publishedApi12, '1.2')
        comparePublishedApi(publishedApi13, '1.3')

        def candidateOutputs = sourceSets.main.output.files.collect { it.canonicalFile }
        def api12CompileClasspath = compileApi12BinaryFixture.get().classpath.files
                .collect { it.canonicalFile }
        def leakedCandidateOutputs = api12CompileClasspath.findAll {
            candidateOutputs.contains(it)
        }
        if (!leakedCandidateOutputs.empty) {
            throw new GradleException(
                    "API 1.2 binary fixture used candidate output: ${leakedCandidateOutputs}")
        }

        def api13CompileClasspath = compileApi13BinaryFixture.get().classpath.files
                .collect { it.canonicalFile }
        def leakedApi13CandidateOutputs = api13CompileClasspath.findAll {
            candidateOutputs.contains(it)
        }
        if (!leakedApi13CandidateOutputs.empty) {
            throw new GradleException(
                    "API 1.3 binary fixture used candidate output: ${leakedApi13CandidateOutputs}")
        }

        def api12Classes = sourceSets.api12BinaryFixture.output.classesDirs.asFileTree.matching {
            include '**/*.class'
        }.files
        if (api12Classes.empty) {
            throw new GradleException('API 1.2 binary fixture contains no classes')
        }
        def nonJava8Api12Classes = api12Classes.findAll { classFile ->
            byte[] bytes = classFile.bytes
            bytes.length < 8 || (((bytes[6] & 0xff) << 8) | (bytes[7] & 0xff)) != 52
        }
        if (!nonJava8Api12Classes.empty) {
            throw new GradleException(
                    "API 1.2 binary fixture is not Java 8 bytecode: ${nonJava8Api12Classes}")
        }
        def api12Bytecode = api12Classes.collect {
            new String(it.bytes, 'ISO-8859-1')
        }.join('\n')
        def forbiddenApi13Names = [
                'ClientHudContext', 'hasKnownRevision', 'getRevision', 'getContext'
        ].findAll { api12Bytecode.contains(it) }
        if (!forbiddenApi13Names.empty) {
            throw new GradleException(
                    "API 1.2 binary fixture references API 1.3 names: ${forbiddenApi13Names}")
        }

        def reobfuscatedApi12 = reobfApi12BinaryFixtureJar.get().archiveFile.get().asFile
        def frozenApi12Digest = java.security.MessageDigest.getInstance('SHA-256')
                .digest(reobfuscatedApi12.bytes).encodeHex().toString().toUpperCase(Locale.ROOT)
        if (reobfuscatedApi12.length() != 4879L
                || frozenApi12Digest != 'BF6994916258709D8895257618F07239CD802C27BEFA6D0373C8AA9E0BEA59EE') {
            throw new GradleException(
                    "Frozen reobfuscated API 1.2 fixture changed: ${reobfuscatedApi12}, "
                            + "size=${reobfuscatedApi12.length()}, sha256=${frozenApi12Digest}")
        }
        def api12Archive = new java.util.zip.ZipFile(reobfuscatedApi12)
        try {
            def api12Entries = api12Archive.entries().findAll {
                !it.directory && it.name.endsWith('.class')
            }
            if (api12Entries.empty) {
                throw new GradleException('Reobfuscated API 1.2 fixture contains no classes')
            }
            def invalidApi12Entries = api12Entries.findAll { entry ->
                byte[] bytes = api12Archive.getInputStream(entry).bytes
                bytes.length < 8 || (((bytes[6] & 0xff) << 8) | (bytes[7] & 0xff)) != 52
            }*.name
            if (!invalidApi12Entries.empty) {
                throw new GradleException(
                        "Reobfuscated API 1.2 fixture is not Java 8 bytecode: ${invalidApi12Entries}")
            }
            def reobfuscatedApi12Bytecode = api12Entries.collect { entry ->
                new String(api12Archive.getInputStream(entry).bytes, 'ISO-8859-1')
            }.join('\n')
            def leakedApi13Names = [
                    'ClientHudContext', 'hasKnownRevision', 'getRevision', 'getContext'
            ].findAll { reobfuscatedApi12Bytecode.contains(it) }
            if (!leakedApi13Names.empty) {
                throw new GradleException(
                        "Reobfuscated API 1.2 fixture references API 1.3 names: ${leakedApi13Names}")
            }
        } finally {
            api12Archive.close()
        }

        def api13Classes = sourceSets.api13BinaryFixture.output.classesDirs.asFileTree.matching {
            include '**/*.class'
        }.files
        if (api13Classes.empty) {
            throw new GradleException('API 1.3 binary fixture contains no classes')
        }
        def nonJava8Api13Classes = api13Classes.findAll { classFile ->
            byte[] bytes = classFile.bytes
            bytes.length < 8 || (((bytes[6] & 0xff) << 8) | (bytes[7] & 0xff)) != 52
        }
        if (!nonJava8Api13Classes.empty) {
            throw new GradleException(
                    "API 1.3 binary fixture is not Java 8 bytecode: ${nonJava8Api13Classes}")
        }
        def api13Bytecode = api13Classes.collect {
            new String(it.bytes, 'ISO-8859-1')
        }.join('\n')
        def missingApi13Names = [
                'ClientHudContext', 'hasKnownRevision', 'getRevision', 'getContext'
        ].findAll { !api13Bytecode.contains(it) }
        if (!missingApi13Names.empty) {
            throw new GradleException(
                    "API 1.3 binary fixture does not exercise API 1.3 names: ${missingApi13Names}")
        }

        def reobfuscatedApi13 = reobfApi13BinaryFixtureJar.get().archiveFile.get().asFile
        def frozenApi13Digest = java.security.MessageDigest.getInstance('SHA-256')
                .digest(reobfuscatedApi13.bytes).encodeHex().toString().toUpperCase(Locale.ROOT)
        if (reobfuscatedApi13.length() != 4833L
                || frozenApi13Digest != '0AF776DE158AF24053F9596D85F47B1A9CEC6066E9FE3E4DCA4B5B1349D036F8') {
            throw new GradleException(
                    "Frozen reobfuscated API 1.3 fixture changed: ${reobfuscatedApi13}, "
                            + "size=${reobfuscatedApi13.length()}, sha256=${frozenApi13Digest}")
        }
        def api13Archive = new java.util.zip.ZipFile(reobfuscatedApi13)
        try {
            def api13Entries = api13Archive.entries().findAll {
                !it.directory && it.name.endsWith('.class')
            }
            if (api13Entries.empty) {
                throw new GradleException('Reobfuscated API 1.3 fixture contains no classes')
            }
            def invalidApi13Entries = api13Entries.findAll { entry ->
                byte[] bytes = api13Archive.getInputStream(entry).bytes
                bytes.length < 8 || (((bytes[6] & 0xff) << 8) | (bytes[7] & 0xff)) != 52
            }*.name
            if (!invalidApi13Entries.empty) {
                throw new GradleException(
                        "Reobfuscated API 1.3 fixture is not Java 8 bytecode: ${invalidApi13Entries}")
            }
            def reobfuscatedApi13Bytecode = api13Entries.collect { entry ->
                new String(api13Archive.getInputStream(entry).bytes, 'ISO-8859-1')
            }.join('\n')
            def missingReobfuscatedApi13Names = [
                    'ClientHudContext', 'hasKnownRevision', 'getRevision', 'getContext'
            ].findAll { !reobfuscatedApi13Bytecode.contains(it) }
            if (!missingReobfuscatedApi13Names.empty) {
                throw new GradleException(
                        "Reobfuscated API 1.3 fixture lost API 1.3 probes: ${missingReobfuscatedApi13Names}")
            }
        } finally {
            api13Archive.close()
        }

        def forbiddenImports = sourceSets.apiCompatibilityFixture.allJava.files.findAll { source ->
            def text = source.getText('UTF-8')
            text.contains('com.mahghuuuls.jawms.internal.')
                    || text.contains('com.mahghuuuls.jawms.client.')
        }
        if (!forbiddenImports.empty) {
            throw new GradleException("API compatibility fixture imports non-public JAWMS code: ${forbiddenImports}")
        }

        def nonJava8Classes = sourceSets.apiCompatibilityFixture.output.classesDirs.asFileTree.matching {
            include '**/*.class'
        }.files.findAll { classFile ->
            byte[] bytes = classFile.bytes
            bytes.length < 8 || (((bytes[6] & 0xff) << 8) | (bytes[7] & 0xff)) != 52
        }
        if (!nonJava8Classes.empty) {
            throw new GradleException("API compatibility fixture is not Java 8 bytecode: ${nonJava8Classes}")
        }

        def productionFixtureJar = reobfApiCompatibilityFixtureJar.get().archiveFile.get().asFile
        def fixtureArchive = new java.util.zip.ZipFile(productionFixtureJar)
        try {
            def fixtureClassEntries = fixtureArchive.entries().findAll {
                !it.directory && it.name.endsWith('.class')
            }
            if (fixtureClassEntries.empty) {
                throw new GradleException('Reobfuscated API compatibility fixture contains no classes')
            }

            def nonProductionFixtureClasses = fixtureClassEntries.findAll { entry ->
                def bytes = fixtureArchive.getInputStream(entry).bytes
                bytes.length < 8 || (((bytes[6] & 0xff) << 8) | (bytes[7] & 0xff)) != 52
            }*.name
            if (!nonProductionFixtureClasses.empty) {
                throw new GradleException(
                        "Reobfuscated API compatibility fixture is not Java 8 bytecode: ${nonProductionFixtureClasses}")
            }

            def fixtureBytecode = fixtureClassEntries.collect { entry ->
                new String(fixtureArchive.getInputStream(entry).bytes, 'ISO-8859-1')
            }.join('\n')
            def developmentNames = [
                    'STICK',
                    'setCount',
                    'getCommandSenderAsPlayer',
                    'sendMessage',
                    'getUsage'
            ]
            def leakedDevelopmentNames = developmentNames.findAll { fixtureBytecode.contains(it) }
            if (!leakedDevelopmentNames.empty) {
                throw new GradleException(
                        "API compatibility fixture was not fully reobfuscated: ${leakedDevelopmentNames}")
            }

            def requiredRuntimeNames = [
                    'field_151055_y', 'func_190920_e', 'func_71521_c', 'func_145747_a',
                    'func_71518_a'
            ]
            def missingRuntimeNames = requiredRuntimeNames.findAll { !fixtureBytecode.contains(it) }
            if (!missingRuntimeNames.empty) {
                throw new GradleException(
                        "Reobfuscated API compatibility fixture is missing expected SRG names: ${missingRuntimeNames}")
            }
        } finally {
            fixtureArchive.close()
        }

        def packagedFixtures = zipTree(tasks.named('reobfJar').get().archiveFile.get().asFile).matching {
            include 'com/mahghuuuls/jawms/testfixture/**'
            include 'example/jawmsaddon/**'
            include 'example/jawmsapi12/**'
            include 'example/jawmsapi13/**'
        }.files
        if (!packagedFixtures.empty) {
            throw new GradleException("Development/API fixture leaked into the production jar: ${packagedFixtures}")
        }

        def productionJar = tasks.named('reobfJar').get().archiveFile.get().asFile
        def archive = new java.util.zip.ZipFile(productionJar)
        try {
            def requiredEntries = [
                    'META-INF/MANIFEST.MF',
                    'mcmod.info',
                    'mixins.jawms.json',
                    'mixins.jawms.refmap.json',
                    'assets/jawms/lang/en_us.lang',
                    'LICENSE',
                    'THIRD-PARTY-NOTICES.md',
                    'com/mahghuuuls/jawms/api/ManaApi.class',
                    'com/mahghuuuls/jawms/api/ManaMutationFailure.class',
                    'com/mahghuuuls/jawms/api/ManaContributionDisposition.class',
                    'com/mahghuuuls/jawms/api/ManaContributionExplanation.class',
                    'com/mahghuuuls/jawms/api/ManaContributionFailure.class',
                    'com/mahghuuuls/jawms/api/ManaContributionSourceKind.class',
                    'com/mahghuuuls/jawms/api/ManaProfileAggregation.class',
                    'com/mahghuuuls/jawms/api/ManaProfileExplanation.class',
                    'com/mahghuuuls/jawms/api/ManaProviderDescriptor.class',
                    'com/mahghuuuls/jawms/api/ManaProviderKind.class',
                    'com/mahghuuuls/jawms/api/client/ClientManaApi.class',
                    'com/mahghuuuls/jawms/api/client/ClientHudContext.class',
                    'com/mahghuuuls/jawms/api/client/ClientManaSnapshot.class',
                    'com/mahghuuuls/jawms/api/client/ManaHudRenderEvent.class'
            ]
            def missingEntries = requiredEntries.findAll { archive.getEntry(it) == null }
            if (!missingEntries.empty) {
                throw new GradleException("Production jar is missing required entries: ${missingEntries}")
            }

            def refmapText = archive.getInputStream(archive.getEntry('mixins.jawms.refmap.json'))
                    .getText('UTF-8')
            def requiredMappings = [
                    'func_77659_a', 'func_77624_a', 'func_77615_a', 'func_77644_a',
                    'func_184597_cx', 'func_135052_a', 'func_75116_a', 'func_75122_a'
            ]
            def missingMappings = requiredMappings.findAll { !refmapText.contains(it) }
            if (!missingMappings.empty) {
                throw new GradleException("Production refmap is missing required mappings: ${missingMappings}")
            }

            def metadataText = archive.getInputStream(archive.getEntry('mcmod.info')).getText('UTF-8')
            def expectedMixinRange = "mixinbooter@[${propertyString('mixin_booter_version')},)"
            def boundedMixinRange = metadataText =~ /mixinbooter@\[[^,]+,[^)]+\)/
            if (!metadataText.contains('ebwizardry@[4.3.19,4.3.20)')
                    || !metadataText.contains(expectedMixinRange)
                    || metadataText.count('mixinbooter@') != 1
                    || boundedMixinRange.find()) {
                throw new GradleException('Production metadata does not contain exactly the approved open MixinBooter range.')
            }

            def modClassEntry = archive.getEntry(
                    'com/mahghuuuls/jawms/JustAnotherWizardryManaSystemMod.class'
            )
            def modClassText = archive.getInputStream(modClassEntry).getText('ISO-8859-1')
            if (!modClassText.contains("required-after:${expectedMixinRange};")) {
                throw new GradleException('Authoritative @Mod metadata does not match the selected MixinBooter build input.')
            }

            def nonJava8Entries = archive.entries().findAll { entry ->
                if (entry.directory || !entry.name.endsWith('.class')) {
                    return false
                }
                def stream = archive.getInputStream(entry)
                try {
                    byte[] header = new byte[8]
                    return stream.read(header) != 8
                            || ((((header[6] & 0xff) << 8) | (header[7] & 0xff)) != 52)
                } finally {
                    stream.close()
                }
            }
            if (!nonJava8Entries.empty) {
                throw new GradleException("Production jar contains non-Java-8 classes: ${nonJava8Entries*.name}")
            }

            def clientOnlyApiReferences = archive.entries().findAll { entry ->
                !entry.directory
                        && entry.name.startsWith('com/mahghuuuls/jawms/api/client/')
                        && entry.name.endsWith('.class')
                        && new String(archive.getInputStream(entry).bytes, 'ISO-8859-1')
                        .contains('net/minecraft/client/')
            }*.name
            if (!clientOnlyApiReferences.empty) {
                throw new GradleException(
                        "Public client API bytecode links client-only Minecraft classes: ${clientOnlyApiReferences}")
            }
        } finally {
            archive.close()
        }

        def bundledBaubles = zipTree(productionJar).matching {
            include 'baubles/**'
        }.files
        if (!bundledBaubles.empty) {
            throw new GradleException("Optional Baubles classes were bundled into the production jar: ${bundledBaubles}")
        }

        def leakedBaublesReferences = zipTree(productionJar).matching {
            include 'com/mahghuuuls/jawms/**/*.class'
            exclude 'com/mahghuuuls/jawms/internal/integration/baubles/**'
        }.files.findAll { classFile ->
            new String(classFile.bytes, 'ISO-8859-1').contains('baubles/api/')
        }
        if (!leakedBaublesReferences.empty) {
            throw new GradleException("Baubles type leaked outside its guarded adapter: ${leakedBaublesReferences}")
        }
    }
}

tasks.named('check').configure {
    dependsOn tasks.named('verifyApiCompatibilityFixture')
}

['runClient', 'runServer'].each { runTaskName ->
    tasks.named(runTaskName).configure {
        dependsOn sourceSets.developmentFixture.classesTaskName,
                sourceSets.apiCompatibilityFixture.classesTaskName,
                reobfApi12BinaryFixtureJar,
                reobfApi13BinaryFixtureJar
        doFirst {
            classpath += sourceSets.developmentFixture.output
            classpath += sourceSets.apiCompatibilityFixture.output
            classpath += files(reobfApi12BinaryFixtureJar.get().archiveFile.get().asFile)
            classpath += files(reobfApi13BinaryFixtureJar.get().archiveFile.get().asFile)
        }
    }
}

// Adds Access Transformer files to tasks
if (propertyBool('use_access_transformer')) {
    for (def location : propertyStringList('access_transformer_locations')) {
        def fileLocation = file("${projectDir}/src/main/resources/${location}")
        if (fileLocation.exists()) {
            tasks.deobfuscateMergedJarToSrg.accessTransformerFiles.from(fileLocation)
            tasks.srgifyBinpatchedJar.accessTransformerFiles.from(fileLocation)
        } else {
            throw new GradleException("Access Transformer file [$fileLocation] does not exist!")
        }
    }
}

processResources {

    inputs.property 'mod_id', propertyString('mod_id')
    inputs.property 'mod_name', propertyString('mod_name')
    inputs.property 'mod_version', propertyString('mod_version')
    inputs.property 'mod_description', propertyString('mod_description')
    inputs.property 'mod_authors', "${propertyStringList('mod_authors', ',').join(', ')}"
    inputs.property 'mod_credits', propertyString('mod_credits')
    inputs.property 'mod_url', propertyString('mod_url')
    inputs.property 'mod_update_json', propertyString('mod_update_json')
    inputs.property 'mod_logo_path', propertyString('mod_logo_path')
    inputs.property 'mixin_refmap', propertyString('mixin_refmap')
    inputs.property 'mixin_package', propertyString('mixin_package')
    inputs.property 'mixin_configs', propertyStringList('mixin_configs').join(' ')

    def filterList = ['mcmod.info', 'pack.mcmeta']
    filterList.addAll(propertyStringList('mixin_configs').collect(config -> "mixins.${config}.json" as String))

    filesMatching(filterList) { fcd ->
        fcd.expand(
                'mod_id': propertyString('mod_id'),
                'mod_name': propertyString('mod_name'),
                'mod_version': propertyString('mod_version'),
                'mod_description': propertyString('mod_description'),
                'mod_authors': "${propertyStringList('mod_authors', ',').join(', ')}",
                'mod_credits': propertyString('mod_credits'),
                'mod_url': propertyString('mod_url'),
                'mod_update_json': propertyString('mod_update_json'),
                'mod_logo_path': propertyString('mod_logo_path'),
                'mixin_refmap': propertyString('mixin_refmap'),
                'mixin_package': propertyString('mixin_package')
        )
    }

    if (propertyBool('use_access_transformer')) {
        rename '(.+_at.cfg)', 'META-INF/$1'
    }

}

jar {
    from(rootProject.file('LICENSE'))
    from(rootProject.file('THIRD-PARTY-NOTICES.md'))

    manifest {
        def attribute_map = [:]
        if (propertyBool('use_mixins')) {
            attribute_map['MixinConfigs'] = propertyStringList('mixin_configs')
                    .collect(config -> "mixins.${config}.json" as String)
                    .join(',')
        }
        if (propertyBool('is_coremod')) {
            attribute_map['FMLCorePlugin'] = propertyString('coremod_plugin_class_name')
            if (propertyBool('coremod_includes_mod')) {
                attribute_map['FMLCorePluginContainsFMLMod'] = true
                def currentTasks = gradle.startParameter.taskNames
                if (currentTasks[0] == 'build' || currentTasks[0] == 'prepareObfModsFolder' || currentTasks[0] == 'runObfClient') {
                    attribute_map['ForceLoadAsMod'] = true
                }
            }
        }
        if (propertyBool('use_access_transformer')) {
            attribute_map['FMLAT'] = propertyString('access_transformer_locations')
        }
        attributes(attribute_map)
    }
}

idea {
    module {
        inheritOutputDirs = true
    }
    project {
        settings {
            runConfigurations {
                "0. Setup Decomp Workspace"(Gradle) {
                    taskNames = ["setupDecompWorkspace"]
                }
                "1. Run Client"(Gradle) {
                    taskNames = ["runClient"]
                }
                "2. Run Server"(Gradle) {
                    taskNames = ["runServer"]
                }
                "3. Run Obfuscated Client"(Gradle) {
                    taskNames = ["runObfClient"]
                }
                "4. Run Obfuscated Server"(Gradle) {
                    taskNames = ["runObfServer"]
                }
            }
            compiler.javac {
                afterEvaluate {
                    javacAdditionalOptions = "-encoding utf8"
                    moduleJavacAdditionalOptions = [
                            (project.name + ".main"): tasks.compileJava.options.compilerArgs.collect { '"' + it + '"' }.join(' ')
                    ]
                }
            }
        }
    }
}

compileTestJava {
    sourceCompatibility = targetCompatibility = 8
}

test {
    useJUnitPlatform()
    javaLauncher.set(javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(8)
    })
    if (propertyBool('show_testing_output')) {
        testLogging {
            showStandardStreams = true
        }
    }
}

String parserChangelog() {
    if (!file('CHANGELOG.md').exists()) {
        throw new GradleException('publish_with_changelog is true, but CHANGELOG.md does not exist in the workspace!')
    }
    String parsedChangelog = changelog.renderItem(
            changelog.get(propertyString('mod_version')).withHeader(false).withEmptySections(false),
            Changelog.OutputType.MARKDOWN)
    if (parsedChangelog.isEmpty()) {
        throw new GradleException('publish_with_changelog is true, but the changelog for the latest version is empty!')
    }
    return parsedChangelog
}

tasks.register('generateMixinJson') {
    group 'cleanroom helpers'
    def missingConfig = propertyStringList('mixin_configs').findAll(config -> !file("src/main/resources/mixins.${config}.json").exists())
    onlyIf {
        if (propertyBool('use_mixins') && propertyBool('generate_mixins_json')) {
            return !missingConfig.empty
        }
        return false
    }
    doLast {
        for (String mixinConfig : missingConfig) {
            def file = file("src/main/resources/mixins.${mixinConfig}.json")
            file << """{\n\t"package": "",\n\t"required": true,\n\t"refmap": "${propertyString('mixin_refmap')}",\n\t"target": "@env(DEFAULT)",\n\t"minVersion": "0.8.5",\n\t"compatibilityLevel": "JAVA_8",\n\t"mixins": [],\n\t"server": [],\n\t"client": []\n}"""
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    if (propertyBool('use_modern_java_syntax')) {
        if (it.name in ['compileMcLauncherJava', 'compilePatchedMcJava']) {
            return
        }
        sourceCompatibility = 17
        options.release.set(8)
        javaCompiler.set(javaToolchains.compilerFor {
            languageVersion.set(JavaLanguageVersion.of(16))
            vendor.set(JvmVendorSpec.AZUL)
        })
    }
}

tasks.register('cleanroomAfterSync') {
    group 'cleanroom helpers'
    dependsOn 'injectTags', 'generateMixinJson'
}

if (propertyBool('use_modern_java_syntax')) {
    tasks.withType(Javadoc).configureEach {
        sourceCompatibility = 17
    }
}

tasks.named('injectTags', InjectTagsTask).configure {
    onlyIf {
        return propertyBool('use_tags') && !it.getTags().get().isEmpty()
    }
    it.outputClassName.set(propertyString('tag_class_name'))
}

tasks.named('prepareObfModsFolder').configure {
    finalizedBy 'prioritizeCoremods'
}

tasks.register('prioritizeCoremods') {
    dependsOn 'prepareObfModsFolder'
    doLast {
        fileTree('run/obfuscated').forEach {
            if (it.isFile() && it.name =~ '(mixinbooter|configanytime)(-)([0-9])+\\.+([0-9])+(.jar)') {
                it.renameTo(new File(it.parentFile, "!${it.name}"))
            }
        }
    }
}

idea.project.settings {
    taskTriggers {
        afterSync 'cleanroomAfterSync'
    }
}

if (propertyBool('publish_to_curseforge')) {
    assertProperty 'curseforge_project_id'
    apply plugin: 'net.darkhax.curseforgegradle'
    tasks.register('curseforge', TaskPublishCurseForge) {
        group 'publishing'
        description "Uploads CurseForge project ${propertyString('curseforge_project_id')}"
    }
}

