        def reobfuscatedApi15 = reobfApi15BinaryFixtureJar.get().archiveFile.get().asFile
        def frozenApi15Digest = java.security.MessageDigest.getInstance('SHA-256')
                .digest(reobfuscatedApi15.bytes).encodeHex().toString().toUpperCase(Locale.ROOT)
        if (reobfuscatedApi15.length() != 4188L
                || frozenApi15Digest != '24E4C8EC8CE0D16007A7083D6C5D65305069FF25BB5238F016E143A47CFDCCD3') {
            throw new GradleException(
                    "Frozen reobfuscated API 1.5 fixture changed: ${reobfuscatedApi15}, "
                            + "size=${reobfuscatedApi15.length()}, sha256=${frozenApi15Digest}")
        }
        def api15Archive = new java.util.zip.ZipFile(reobfuscatedApi15)
        try {
