tasks.register('verifyCastCostFixture') {
    group = 'verification'
    dependsOn reobfCastCostFixtureJar, tasks.named('reobfJar')
    inputs.files(sourceSets.castCostFixture.allSource)
    doLast {
        def forbiddenSource = sourceSets.castCostFixture.allJava.files.findAll {
            it.getText('UTF-8') =~ /com\.mahghuuuls\.jawms\.(?!api[.;])/
        }
        if (!forbiddenSource.empty) throw new GradleException("Non-public fixture imports: ${forbiddenSource}")
        def fixture = new java.util.zip.ZipFile(reobfCastCostFixtureJar.get().archiveFile.get().asFile)
        try {
            def classes = fixture.entries().findAll { !it.directory && it.name.endsWith('.class') }
            if (classes.empty) throw new GradleException('Cast-cost fixture has no classes')
            classes.each { entry ->
                byte[] bytes = fixture.getInputStream(entry).bytes
                if ((bytes[6] & 255) != 0 || (bytes[7] & 255) != 52) {
                    throw new GradleException("Cast-cost fixture is not Java 8: ${entry.name}")
                }
                def text = new String(bytes, 'ISO-8859-1')
                if (text.contains('com/mahghuuuls/jawms/internal/')
                        || text.contains('com/mahghuuuls/jawms/client/')
                        || text.contains('net/minecraft/client/')) {
                    throw new GradleException("Cast-cost fixture leaks non-public/client linkage: ${entry.name}")
                }
            }
        } finally { fixture.close() }
        def leaked = zipTree(tasks.named('reobfJar').get().archiveFile.get().asFile).matching {
            include 'example/jawmscast/**'
            include 'com/mahghuuuls/jawms/testfixture/**'
            include 'mixins.jawms-publication-observer.json'
        }.files
        if (!leaked.empty) throw new GradleException('Cast-cost fixture leaked into primary JAR')
    }
}

tasks.register('verifyCastCostFixtureDevelopmentLaunch') {
    group = 'verification'
    description = 'Checks the configured fixture origin without executing a client or server.'
    dependsOn castCostFixtureJar
    def enabled = providers.gradleProperty('jawmsIncludeCastCostFixture')
            .getOrElse('false').toBoolean()
    inputs.property 'fixtureEnabled', enabled
    doLast {
        File fixtureJar = castCostFixtureJar.get().archiveFile.get().asFile.canonicalFile
        Set<File> possibleOrigins = sourceSets.castCostFixture.output.files
                .collect { it.canonicalFile } as Set
        possibleOrigins.add(fixtureJar)
        ['runClient', 'runServer'].each { taskName ->
            Set<File> configuredOrigins = tasks.named(taskName).get().classpath.files
                    .collect { it.canonicalFile }.findAll { possibleOrigins.contains(it) } as Set
            Set<File> expectedOrigins = enabled ? [fixtureJar] as Set : [] as Set
            if (configuredOrigins != expectedOrigins) {
                throw new GradleException("${taskName} fixture origins ${configuredOrigins}; "
                        + "expected ${expectedOrigins}. Wizardry scans one mod source for spell JSON.")
            }
        }
    }
}

