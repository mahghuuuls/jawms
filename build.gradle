def openRuntimeRange = { String modId, String minimumProperty ->
    def minimum = propertyString(minimumProperty)
    if (minimum.isEmpty() || minimum.find(/[\[\]()@,\s]/)) {
        throw new GradleException("Invalid runtime minimum ${minimumProperty}=${minimum}")
    }
    "${modId}@[${minimum},)"
}
def assertExactOpenRuntimeRanges = { Collection<String> actual,
        Collection<String> expected, String surface ->
    def openRangePattern = /^[a-z0-9_.-]+@\[[^,\]\)]+,\)$/
    if (actual.any { !(it ==~ openRangePattern) }
            || actual.toSet() != expected.toSet()
            || actual.size() != expected.size()) {
        throw new GradleException(
                "${surface} does not contain exactly the build-owned open runtime ranges.")
    }
}

