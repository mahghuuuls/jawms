                    .findAll().collect { match -> match.toString() }
            jawmsReferences.any { reference ->
                !reference.startsWith('com.mahghuuuls.jawms.api.')
            }
        }
        if (!forbiddenJawmsSources.empty) {
            throw new GradleException(
                    "API compatibility fixture references non-public JAWMS code: ${forbiddenJawmsSources}")
        }

        def currentFixtureSource = sourceSets.apiCompatibilityFixture.allJava.files.collect {
            it.getText('UTF-8')
        }.join('\n')
        def requiredCurrentFixtureNames = [
                'getConfiguredFlaskSnapshot', 'flatLockoutIncreaseSeconds',
                'flatLockoutReductionSeconds', 'registerItemProvider',
                'setItemProviderContributionPreview',
                'clearItemProviderContributionPreview',
                'startRegenerationLockout'
        ]
        def missingCurrentFixtureNames = requiredCurrentFixtureNames.findAll {
            !currentFixtureSource.contains(it)
        }
        if (!missingCurrentFixtureNames.empty) {
            throw new GradleException(
                    "Current compatibility fixture does not exercise current API names: ${missingCurrentFixtureNames}")
        }

        def nonJava8Classes = sourceSets.apiCompatibilityFixture.output.classesDirs.asFileTree.matching {
            include '**/*.class'
        }.files.findAll { classFile ->
            byte[] bytes = classFile.bytes
            bytes.length < 8 || (((bytes[6] & 0xff) << 8) | (bytes[7] & 0xff)) != 52
        }
        if (!nonJava8Classes.empty) {
            throw new GradleException("API compatibility fixture is not Java 8 bytecode: ${nonJava8Classes}")
        }

        def productionFixtureJar = reobfApiCompatibilityFixtureJar.get().archiveFile.get().asFile
        def fixtureArchive = new java.util.zip.ZipFile(productionFixtureJar)
        try {
            def fixtureClassEntries = fixtureArchive.entries().findAll {
                !it.directory && it.name.endsWith('.class')
            }
            if (fixtureClassEntries.empty) {
                throw new GradleException('Reobfuscated API compatibility fixture contains no classes')
            }

            def nonProductionFixtureClasses = fixtureClassEntries.findAll { entry ->
                def bytes = fixtureArchive.getInputStream(entry).bytes
                bytes.length < 8 || (((bytes[6] & 0xff) << 8) | (bytes[7] & 0xff)) != 52
            }*.name
            if (!nonProductionFixtureClasses.empty) {
                throw new GradleException(
                        "Reobfuscated API compatibility fixture is not Java 8 bytecode: ${nonProductionFixtureClasses}")
            }

            def fixtureBytecode = fixtureClassEntries.collect { entry ->
                new String(fixtureArchive.getInputStream(entry).bytes, 'ISO-8859-1')
            }.join('\n')
            def jawmsBytecodeReferences = (fixtureBytecode =~ /com\/mahghuuuls\/jawms\/[A-Za-z0-9_$\/]+/)
                    .findAll().collect { match -> match.toString() }
            def forbiddenJawmsBytecodeReferences = jawmsBytecodeReferences.findAll { reference ->
                !reference.startsWith('com/mahghuuuls/jawms/api/')
            }.unique()
            if (!forbiddenJawmsBytecodeReferences.empty) {
                throw new GradleException(
                        "Reobfuscated API compatibility fixture references non-public JAWMS code: "
                                + forbiddenJawmsBytecodeReferences)
            }
            def developmentNames = [
                    'STICK',
                    'setCount',
                    'getCommandSenderAsPlayer',
                    'sendMessage',
                    'getUsage'
            ]
            def leakedDevelopmentNames = developmentNames.findAll { fixtureBytecode.contains(it) }
            if (!leakedDevelopmentNames.empty) {
                throw new GradleException(
                        "API compatibility fixture was not fully reobfuscated: ${leakedDevelopmentNames}")
            }

            def requiredRuntimeNames = [
                    'field_151055_y', 'func_190920_e', 'func_71521_c', 'func_145747_a',
                    'func_71518_a'
            ]
            def missingRuntimeNames = requiredRuntimeNames.findAll { !fixtureBytecode.contains(it) }
            if (!missingRuntimeNames.empty) {
                throw new GradleException(
                        "Reobfuscated API compatibility fixture is missing expected SRG names: ${missingRuntimeNames}")
            }
        } finally {
            fixtureArchive.close()
        }

        def packagedFixtures = zipTree(tasks.named('reobfJar').get().archiveFile.get().asFile).matching {
            include 'com/mahghuuuls/jawms/testfixture/**'
            include 'example/jawmsaddon/**'
            include 'example/jawmsapi12/**'
            include 'example/jawmsapi13/**'
            include 'example/jawmsapi14/**'
            include 'example/jawmsapi15/**'
        }.files
        if (!packagedFixtures.empty) {
            throw new GradleException("Development/API fixture leaked into the production jar: ${packagedFixtures}")
        }

        def productionJar = tasks.named('reobfJar').get().archiveFile.get().asFile
        def archive = new java.util.zip.ZipFile(productionJar)
        try {
            def requiredEntries = [
                    'META-INF/MANIFEST.MF',
                    'mcmod.info',
                    'mixins.jawms.json',
                    'mixins.jawms.refmap.json',
                    'assets/jawms/lang/en_us.lang',
                    'LICENSE',
                    'THIRD-PARTY-NOTICES.md',
                    'com/mahghuuuls/jawms/api/ManaApi.class',
                    'com/mahghuuuls/jawms/api/ConfiguredFlaskSnapshot.class',
                    'com/mahghuuuls/jawms/api/ManaMutationFailure.class',
                    'com/mahghuuuls/jawms/api/ManaContributionDisposition.class',
                    'com/mahghuuuls/jawms/api/ManaContributionExplanation.class',
                    'com/mahghuuuls/jawms/api/ManaContributionFailure.class',
                    'com/mahghuuuls/jawms/api/ManaContributionSourceKind.class',
                    'com/mahghuuuls/jawms/api/ManaProfileAggregation.class',
                    'com/mahghuuuls/jawms/api/ManaProfileExplanation.class',
                    'com/mahghuuuls/jawms/api/ManaProviderDescriptor.class',
                    'com/mahghuuuls/jawms/api/ManaProviderKind.class',
                    'com/mahghuuuls/jawms/api/client/ClientManaApi.class',
                    'com/mahghuuuls/jawms/api/client/ClientHudContext.class',
                    'com/mahghuuuls/jawms/api/client/ClientManaSnapshot.class',
                    'com/mahghuuuls/jawms/api/client/ManaHudRenderEvent.class',
                    'com/mahghuuuls/jawms/client/FinalManaTooltipAssembler.class',
                    'com/mahghuuuls/jawms/mixin/ItemStackTooltipClientMixin.class'
            ]
            def missingEntries = requiredEntries.findAll { archive.getEntry(it) == null }
            if (!missingEntries.empty) {
                throw new GradleException("Production jar is missing required entries: ${missingEntries}")
            }

            def refmapText = archive.getInputStream(archive.getEntry('mixins.jawms.refmap.json'))
                    .getText('UTF-8')
            def requiredMappings = [
                    'func_77659_a', 'func_77624_a', 'func_77615_a', 'func_77644_a',
                    'func_184597_cx', 'func_135052_a', 'func_75116_a', 'func_75122_a',
                    'func_82840_a'
            ]
            def missingMappings = requiredMappings.findAll { !refmapText.contains(it) }
            if (!missingMappings.empty) {
                throw new GradleException("Production refmap is missing required mappings: ${missingMappings}")
            }

            def metadataText = archive.getInputStream(archive.getEntry('mcmod.info')).getText('UTF-8')
            def expectedWizardryRange = openRuntimeRange(
                    'ebwizardry', 'wizardry_min_version')
            def expectedMixinRange = openRuntimeRange(
                    'mixinbooter', 'mixin_booter_min_version')
            def expectedBaublesRange = openRuntimeRange(
                    'baubles', 'baubles_min_version')
            def expectedRuntimeRanges = [
                    expectedWizardryRange, expectedMixinRange, expectedBaublesRange
            ]
            def currentDependencyRanges = []
            def dependencyRangeMatcher = metadataText =~ /(?:ebwizardry|mixinbooter|baubles)@[^"\s]+/
            while (dependencyRangeMatcher.find()) {
                currentDependencyRanges.add(dependencyRangeMatcher.group())
            }
            assertExactOpenRuntimeRanges(
                    currentDependencyRanges, expectedRuntimeRanges, 'Production metadata')

            def priorClosedSamples = [
                    ['ebwizardry@[4.3.19,4.3.20)', [expectedWizardryRange]],
                    ['jawms@[1.0.0,1.1.0)', [openRuntimeRange(
                            'jawms', 'developer_tools_jawms_min_version')]]
            ]
            priorClosedSamples.each { sample ->
                try {
                    assertExactOpenRuntimeRanges(
                            [sample[0]], sample[1] as Collection<String>, 'Sensitivity sample')
                    throw new GradleException(
                            "Open-range verifier accepted prior closed range ${sample[0]}")
                } catch (GradleException expectedRejection) {
                    if (expectedRejection.message.startsWith('Open-range verifier accepted')) {
                        throw expectedRejection
                    }
                }
            }

            def modClassEntry = archive.getEntry(
                    'com/mahghuuuls/jawms/JustAnotherWizardryManaSystemMod.class'
            )
            def modClassText = archive.getInputStream(modClassEntry).getText('ISO-8859-1')
            def expectedModDependencies = ("required-after:${expectedWizardryRange};"
                    + "required-after:${expectedMixinRange};"
                    + "after:${expectedBaublesRange}")
            if (!modClassText.contains(expectedModDependencies)) {
                throw new GradleException(
                        'Authoritative @Mod metadata does not match the build-owned open runtime ranges.')
            }

            def nonJava8Entries = archive.entries().findAll { entry ->
                if (entry.directory || !entry.name.endsWith('.class')) {
                    return false
                }
                def stream = archive.getInputStream(entry)
                try {
                    byte[] header = new byte[8]
                    return stream.read(header) != 8
                            || ((((header[6] & 0xff) << 8) | (header[7] & 0xff)) != 52)
                } finally {
                    stream.close()
                }
            }
            if (!nonJava8Entries.empty) {
                throw new GradleException("Production jar contains non-Java-8 classes: ${nonJava8Entries*.name}")
            }

            def clientOnlyApiReferences = archive.entries().findAll { entry ->
                !entry.directory
                        && entry.name.startsWith('com/mahghuuuls/jawms/api/client/')
                        && entry.name.endsWith('.class')
                        && new String(archive.getInputStream(entry).bytes, 'ISO-8859-1')
                        .contains('net/minecraft/client/')
            }*.name
            if (!clientOnlyApiReferences.empty) {
                throw new GradleException(
                        "Public client API bytecode links client-only Minecraft classes: ${clientOnlyApiReferences}")
            }
        } finally {
            archive.close()
        }

        def bundledBaubles = zipTree(productionJar).matching {
            include 'baubles/**'
        }.files
        if (!bundledBaubles.empty) {
            throw new GradleException("Optional Baubles classes were bundled into the production jar: ${bundledBaubles}")
        }

        def leakedBaublesReferences = zipTree(productionJar).matching {
            include 'com/mahghuuuls/jawms/**/*.class'
            exclude 'com/mahghuuuls/jawms/internal/integration/baubles/**'
        }.files.findAll { classFile ->
            new String(classFile.bytes, 'ISO-8859-1').contains('baubles/api/')
        }
        if (!leakedBaublesReferences.empty) {
            throw new GradleException("Baubles type leaked outside its guarded adapter: ${leakedBaublesReferences}")
        }
    }
}

tasks.register('verifyStableReleaseMetadata') {
    group = 'verification'
    inputs.property 'mod_version', propertyString('mod_version')
    inputs.property 'developer_tools_version', propertyString('developer_tools_version')
    inputs.property 'release_type', propertyString('release_type')
    inputs.file 'CHANGELOG.md'
    inputs.file 'README.md'
    inputs.file 'MOD-PAGE.md'
    doLast {
        def expectedVersion = '1.2.0'
        if (propertyString('mod_version') != expectedVersion
                || propertyString('developer_tools_version') != expectedVersion
                || propertyString('release_type') != 'release') {
            throw new GradleException(
                    'Candidate must use primary/tool version 1.2.0 and release_type=release.')
        }
    }
}

// Release copy is checked explicitly at presentation; intermediate candidates
// must have honest identity without pretending their gameplay is release-ready.
tasks.register('verifyReleasePresentation') {
    group = 'verification'
    dependsOn tasks.named('verifyStableReleaseMetadata')
    inputs.file 'CHANGELOG.md'
    inputs.file 'README.md'
    inputs.file 'MOD-PAGE.md'
    doLast {
        def changelog = file('CHANGELOG.md').getText('UTF-8')
        def readme = file('README.md').getText('UTF-8')
        def modPage = file('MOD-PAGE.md').getText('UTF-8')
        if (!changelog.contains('## [1.2.0]')
                || readme.contains('public beta')
                || modPage.contains('Beta release:')) {
            throw new GradleException(
                    'Stable 1.2.0 release copy is not ready for presentation.')
        }
    }
}

tasks.named('check').configure {
    dependsOn tasks.named('verifyCastCostFixtureDevelopmentLaunch')
    dependsOn tasks.named('verifyCastCostFixture')
    dependsOn tasks.named('verifyApiCompatibilityFixture'),
            tasks.named('verifyDeveloperToolsArtifact'),
            tasks.named('verifyStableReleaseMetadata')
}

def includeDeveloperToolsInRuns = providers.gradleProperty('jawmsIncludeDeveloperTools')
        .getOrElse('false').toBoolean()

['runClient', 'runServer'].each { runTaskName ->
    tasks.named(runTaskName).configure {
        if (providers.gradleProperty('jawmsIncludeCastCostFixture').getOrElse('false').toBoolean()) {
            dependsOn castCostFixtureJar
            // Wizardry scans the mod's own origin, not separate resource classpath roots.
            classpath += files(castCostFixtureJar.flatMap { it.archiveFile })
        }
        dependsOn sourceSets.developmentFixture.classesTaskName,
                sourceSets.apiCompatibilityFixture.classesTaskName,
                reobfApi12BinaryFixtureJar,
                reobfApi13BinaryFixtureJar,
                reobfApi14BinaryFixtureJar,
                reobfApi15BinaryFixtureJar
        if (includeDeveloperToolsInRuns) {
            dependsOn sourceSets.developerTools.classesTaskName
        }
        doFirst {
            classpath += sourceSets.developmentFixture.output
            classpath += sourceSets.apiCompatibilityFixture.output
            classpath += files(reobfApi12BinaryFixtureJar.get().archiveFile.get().asFile)
            classpath += files(reobfApi13BinaryFixtureJar.get().archiveFile.get().asFile)
            classpath += files(reobfApi14BinaryFixtureJar.get().archiveFile.get().asFile)
            classpath += files(reobfApi15BinaryFixtureJar.get().archiveFile.get().asFile)
            if (includeDeveloperToolsInRuns) {
                classpath += sourceSets.developerTools.output
            }
        }
    }
}

