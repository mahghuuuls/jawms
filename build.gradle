                !it.directory && it.name.endsWith('.class')
            }
            if (api15Entries.empty) {
                throw new GradleException('Reobfuscated API 1.5 fixture contains no classes')
            }
            def invalidApi15Entries = api15Entries.findAll { entry ->
                byte[] bytes = api15Archive.getInputStream(entry).bytes
